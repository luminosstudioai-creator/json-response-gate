[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "json-response-gate"
version = "0.1.0"
description = "Strict JSON contracts for AI responses: reject ambiguity before application code runs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Mika Mischke"}]
dependencies = []

[project.urls]
Repository = "https://github.com/luminosstudioai-creator/json-response-gate"

[tool.setuptools]
py-modules = ["gate"]
